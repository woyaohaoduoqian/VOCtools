name: Verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/run.mjs
      - run: node tests/plugin-contract.mjs
      - shell: pwsh
        run: ./agent/scripts/sync-plugin.ps1 -Check
